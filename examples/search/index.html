<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Search — treem</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 100vh;
    }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto; min-height: unset }
    }

    /* Demo panel */
    .demo { display: grid; place-items: start center; padding: 2.5rem 2rem; overflow-y: auto }
    .inner { width: 100%; max-width: 400px }
    .back { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: #aaa; text-decoration: none; margin-bottom: 1.5rem }
    .back:hover { color: #666 }
    h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: .25rem }
    .sub { font-size: .8rem; color: #999; margin-bottom: 1.25rem }

    /* Search box */
    .search-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }
    .search-wrap input {
      width: 100%; padding: .7rem 2.4rem .7rem .95rem;
      border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: .9rem; font-family: inherit; outline: none;
      background: #fff; color: #111;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: #888 }
    .spinner {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px;
      border: 2px solid #ddd; border-top-color: #555;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg) } }

    /* Result states */
    .muted { font-size: .82rem; color: #aaa; text-align: center; padding: 2rem 0 }
    .error-box { background: #fff3f3; border: 1px solid #fcc; border-radius: 10px; padding: .75rem 1rem; font-size: .82rem; color: #c00 }

    /* User grid */
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: .75rem;
    }
    .user-card {
      display: flex; flex-direction: column; align-items: center; gap: .3rem;
      padding: .75rem .5rem;
      background: #fff; border-radius: 12px;
      border: 1px solid #eee;
      color: #111;
      text-align: center;
      transition: background .12s, transform .1s, box-shadow .12s;
    }
    .user-card:hover { background: #fafafa; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.07) }
    .user-card img  { width: 52px; height: 52px; border-radius: 50%; background: #eee }
    .user-card .name     { font-size: .78rem; font-weight: 600; line-height: 1.2 }
    .user-card .username { font-size: .7rem; color: #999 }

    /* Code panel */
    .code { padding: 1.5rem; overflow: hidden; display: flex; flex-direction: column }
    #code-panel { flex: 1; border-radius: 12px; overflow: hidden }
  </style>
</head>
<body>
  <div class="demo">
    <div class="inner">
      <a class="back" href="/">← Examples</a>
      <h2>User Search</h2>
      <p class="sub">
        Async state in treem — store models loading/success/error,
        <code>watch</code> cleanup debounces and aborts in-flight requests.
      </p>

      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search by name or username…" autocomplete="off" spellcheck="false">
        <div id="spinner" class="spinner" hidden></div>
      </div>

      <div id="error-box" class="error-box" hidden>
        <span id="error-text"></span>
      </div>

      <div id="empty-box" class="muted" hidden>No users found.</div>

      <div id="results" class="results" hidden></div>
    </div>
  </div>

  <div class="code">
    <div id="code-panel"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
