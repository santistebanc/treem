<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing — treem</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 100vh;
    }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto; min-height: unset }
    }

    .demo { display: grid; place-items: center; padding: 2rem }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 300px;
      text-align: center;
    }
    .back { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: #aaa; text-decoration: none; margin-bottom: 1.5rem }
    .back:hover { color: #666 }

    .toggle-group {
      display: inline-flex;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
      margin-bottom: .75rem;
    }
    .toggle-opt {
      padding: .35rem .85rem;
      font-size: .82rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: all .18s;
      font-family: inherit;
    }
    .toggle-opt.active { background: white; color: #111; box-shadow: 0 1px 4px rgba(0,0,0,.12) }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1rem 0 1.25rem }

    .plan-name { font-size: 1.1rem; font-weight: 800; color: #111; margin-bottom: .2rem }
    .tagline   { font-size: .8rem; color: #aaa; margin-bottom: .9rem }

    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .55rem;
      border-radius: 20px;
      margin-bottom: .5rem;
      letter-spacing: .03em;
    }

    .price-row { display: flex; align-items: baseline; justify-content: center; gap: .3rem; margin-bottom: .3rem }
    .price { font-size: 3.2rem; font-weight: 800; color: #111; font-variant-numeric: tabular-nums; line-height: 1 }
    .per   { font-size: .9rem; color: #888; font-weight: 500 }
    .billing-note { font-size: .78rem; color: #aaa; margin-bottom: 1.75rem }

    .cta {
      width: 100%;
      padding: .75rem;
      background: #111;
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: background .25s, transform .1s;
    }
    .cta:hover { filter: brightness(1.15) }
    .cta:active { transform: scale(.98) }

    .code { padding: 1.5rem; overflow: hidden; display: flex; flex-direction: column }
    #code-panel { flex: 1; border-radius: 12px; overflow: hidden }
  </style>
</head>
<body>
  <div class="demo">
    <div>
      <a class="back" href="/">← Examples</a>
      <div class="card">

        <div class="toggle-group">
          <button class="toggle-opt active" id="basic-btn">Basic</button>
          <button class="toggle-opt"        id="pro-btn">Pro</button>
        </div>
        <br>
        <div class="toggle-group">
          <button class="toggle-opt active" id="monthly-btn">Monthly</button>
          <button class="toggle-opt"        id="annual-btn">Annual</button>
        </div>

        <hr class="divider">

        <div class="plan-name" id="plan-name">Basic</div>
        <div class="tagline"   id="tagline">For individuals</div>

        <div class="badge" id="badge" hidden></div>

        <div class="price-row">
          <div class="price" id="price">$9.99</div>
          <div class="per">/ mo</div>
        </div>
        <div class="billing-note" id="billing">Billed monthly, cancel anytime</div>

        <button class="cta" id="cta">Start Basic →</button>
      </div>
    </div>
  </div>

  <div class="code">
    <div id="code-panel"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
